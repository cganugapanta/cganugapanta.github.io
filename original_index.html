<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Webpage | UNC Charlotte</title>
    <style>
      body {
        background-color: #FFFFFF;
        color: #333333;
        margin: 0;
        padding: 0;
      }
      #page-wrapper {
        height: 100%;
        width: 100%;
        max-width: 950px;
        margin: auto;
      }
      #logo-wrapper {
        padding-top: 20px;
        padding-bottom: 10px;
        text-align: center;
        border-bottom: 1px solid #006633;
      }
      #content-wrapper {
        width: 100%;
        max-width: 950px;
        margin: auto;
        text-align: center;
      }
      a {
        color: #006633;
      }
    </style>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
  </head>
  <body>
    <div id="page-wrapper">
      <header id="header-wrapper">
        <div id="header-container">
          <div id="logo-wrapper">
            <a href="https://www.charlotte.edu">
              <h2>UNC Charlotte</h2>
            </a>
          </div>
        </div>
      </header>
      <main id="content-wrapper">
        <p>Your personal webpage has been created.</p>
      </main>
      <footer>
        <p>
          <a href="https://validator.w3.org/check?uri=referer">Validate HTML</a> | 
          <a href="https://jigsaw.w3.org/css-validator/check/referer">Validate CSS</a>
        </p>
      </footer>
    </div>
  </body>
</html>
