<!DOCTYPE html>
<html>
<head>
    <title>The Terrible CRAPpy Page</title>
</head>
<body style="background-color: white; color: black; margin-top: 100px; margin-left: 5px; margin-right: 80px;">

    <!-- Out-of-order headers (h2 before h1) -->
    <h2 style="font-family: 'Comic Sans MS', cursive; text-align: center;">Welcome to the Bad Webpage!</h2>
    <h1 style="font-family: 'Papyrus', fantasy;">This is a Terrible Example</h1>

    <!-- Centered serif font with a massive font size -->
    <p style="text-align: center; font-size: 32px; font-family: 'Times New Roman', Times, serif;">
        This line uses a serif font and huge text size!
    </p>

    <!-- Underlining text that isn't a link, bad contrast background, and inline styles -->
    <p style="background-color: #ffff00; color: #ffffcc; font-size: 18px;">
        <u style="font-family: 'Comic Sans MS', cursive;">This text is underlined but IT IS NOT A LINK!</u> 
        This might be hard to read.
    </p>

    <br><br><br> <!-- Extra blank lines -->

    <!-- Image missing file extension in src, distorted 400x400 aspect ratio, 
         a massive/bad alt text, and different borders on every side -->
    <img src="https://picsum.photos/2000/3000" 
         width="400" 
         height="400" 
         alt="This is a giant and unnecessarily long alt text that ruins screen readers and provides a terrible user experience because it goes on and on describing nothing useful!" 
         style="border-top: 25px solid red; border-right: 10px dashed blue; border-bottom: 30px double green; border-left: 15px dotted yellow;">

    <!-- Caption using a heading tag with zero relation to the image -->
    <h3>idk</h3>

    <br><br> <!-- Extra blank lines -->

    <!-- Centered bulleted list using Papyrus -->
    <ul style="text-align: center; list-style-position: inside; font-family: 'Papyrus', fantasy;">
        <li>hello</li>
        <li>its me</li>
        <li>-adele</li>
    </ul>

    <!-- Unstyled link using browser default blue/purple colors -->
    <p style="text-align: center;">
        <a href="../index.html">Back to Course Page</a>
    </p>

</body>
</html>
